{{- $root := . -}}
{{- range $name, $comp := .Values.components }}
{{- if $comp.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ion-c5.fullname" $root }}-{{ $name }}
  labels:
    {{- include "ion-c5.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  {{- if not (and $comp.hpa $comp.hpa.enabled) }}
  replicas: {{ $comp.replicas | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ion-c5.name" $root }}
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ion-c5.name" $root }}
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        app.kubernetes.io/component: {{ $name }}
      annotations:
        checksum/config: {{ include "ion-c5.configIni" $root | sha256sum }}
    spec:
      serviceAccountName: {{ include "ion-c5.serviceAccountName" $root }}
      {{- with $root.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        {{- if $root.Values.securityContext.runAsUser }}
        runAsUser: {{ $root.Values.securityContext.runAsUser }}
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: {{ $root.Values.terminationGracePeriodSeconds }}
      {{- $waitCfg := $root.Values.startupOrder }}
      {{- $wait := and $waitCfg.waitForAdmin (ne $name "admin") $root.Values.components.admin.enabled }}
      {{- if hasKey $comp "waitForAdmin" }}
      {{- $wait = and $wait $comp.waitForAdmin }}
      {{- end }}
      {{- if $wait }}
      initContainers:
        # Startup ordering: block until the admin module is ready (values.yaml
        # `startupOrder`). Goes through the admin Service, so it also implies
        # admin passed its readiness probe. Pod shows Init:0/1 until then.
        - name: wait-for-admin
          {{- if $waitCfg.image.digest }}
          image: "{{ $root.Values.global.imageRegistry }}/{{ $waitCfg.image.repository }}@{{ $waitCfg.image.digest }}"
          {{- else }}
          image: "{{ $root.Values.global.imageRegistry }}/{{ $waitCfg.image.repository }}:{{ $waitCfg.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          command:
            - /bin/sh
            - -c
            - |
              url="http://{{ include "ion-c5.fullname" $root }}-admin{{ $root.Values.components.admin.probes.readinessPath | default "/health/ready" }}"
              until wget -q -O /dev/null "$url"; do
                echo "waiting for admin module at $url"
                sleep 5
              done
          resources:
            {{- toYaml $waitCfg.resources | nindent 12 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          {{- if $comp.image.digest }}
          image: "{{ $root.Values.global.imageRegistry }}/{{ $comp.image.repository }}@{{ $comp.image.digest }}"
          {{- else }}
          image: "{{ $root.Values.global.imageRegistry }}/{{ $comp.image.repository }}:{{ $comp.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ $root.Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: {{ $root.Values.securityContext.readOnlyRootFilesystem }}
          {{- if $comp.containerPort }}
          ports:
            - name: http
              containerPort: {{ $comp.containerPort }}
              protocol: TCP
          {{- end }}
          env:
            {{- if and $comp.listenPortEnv $comp.containerPort }}
            - name: {{ $comp.listenPortEnv }}
              value: {{ $comp.containerPort | quote }}
            {{- end }}
            {{- if $comp.configFileEnv }}
            - name: {{ $comp.configFileEnv }}
              value: /etc/ion-c5/config.ini
            {{- end }}
            {{- range $k, $v := $comp.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- if $comp.useAppSecret }}
          envFrom:
            - secretRef:
                name: {{ $root.Values.secrets.appSecretName }}
          {{- end }}
          {{- if $comp.probes.enabled }}
          {{- /* Endpoints per manual ch. 8 (1.0.0b2): /health/startup, /health/ready,
               /health/liveness on the module listen port. Paths overridable. */}}
          startupProbe:
            {{- if eq $comp.probes.type "http" }}
            httpGet:
              path: {{ $comp.probes.startupPath | default "/health/startup" }}
              port: http
            {{- else }}
            tcpSocket:
              port: http
            {{- end }}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            {{- if eq $comp.probes.type "http" }}
            httpGet:
              path: {{ $comp.probes.readinessPath | default "/health/ready" }}
              port: http
            {{- else }}
            tcpSocket:
              port: http
            {{- end }}
            periodSeconds: 10
            {{- /* /health/ready runs real dependency checks (DB queries) — allow
                 more time than a trivial ping (manual: "may react slower"). */}}
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            {{- if eq $comp.probes.type "http" }}
            httpGet:
              path: {{ $comp.probes.livenessPath | default "/health/liveness" }}
              port: http
            {{- else }}
            tcpSocket:
              port: http
            {{- end }}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          {{- end }}
          resources:
            {{- toYaml $comp.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $comp.configFileEnv }}
            - name: config
              mountPath: /etc/ion-c5/config.ini
              subPath: config.ini
              readOnly: true
            {{- end }}
            {{- if $comp.peppolCert }}
            - name: peppol
              mountPath: /etc/ion-c5/peppol
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if $comp.configFileEnv }}
        - name: config
          configMap:
            name: {{ include "ion-c5.fullname" $root }}-config
        {{- end }}
        {{- if $comp.peppolCert }}
        - name: peppol
          secret:
            secretName: {{ $root.Values.secrets.peppolSecretName }}
        {{- end }}
{{- end }}
{{- end }}
