{{- $root := . -}}
{{- range $name, $comp := .Values.components }}
{{- if and $comp.enabled $comp.hpa $comp.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "ion-c5.fullname" $root }}-{{ $name }}
  labels:
    {{- include "ion-c5.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "ion-c5.fullname" $root }}-{{ $name }}
  minReplicas: {{ $comp.hpa.minReplicas | default 1 }}
  maxReplicas: {{ $comp.hpa.maxReplicas | default 4 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $comp.hpa.targetCPUUtilizationPercentage | default 75 }}
{{- end }}
{{- end }}
