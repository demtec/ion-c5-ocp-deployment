# Default values for ion-c5 — targets delivery 1.0.0b5.
# Environment-specific overrides belong in values-<env>.yaml (see values-test.yaml).
# No value in this file may be environment-specific.

global:
  # Customer container registry prefix (images pushed there from the supplier tarballs).
  imageRegistry: "registry.customer.example/ion-c5"
  imagePullPolicy: IfNotPresent
  # - name: regcred
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

# Pre-created Kubernetes Secrets (see chart README for exact key spec).
secrets:
  # Opaque secret whose KEYS ARE ENV VAR NAMES consumed by the modules:
  #   ION_C5_MAIN_DB_PASSWORD, ION_C5_RECEIVER_DB_PASSWORD, ION_C5_TDD_DB_PASSWORD,
  #   ION_C5_ADMIN_JWT_SECRET, ION_C5_PEPPOL_PRIVATE_KEY_PASSWORD (optional)
  appSecretName: ion-c5-app
  # Opaque secret with keys: certificate.pem, private.key (mounted to receiver & sender)
  peppolSecretName: ion-c5-peppol

# Non-sensitive runtime configuration rendered into a ConfigMap as config.ini
# and mounted read-only at /etc/ion-c5/config.ini in all ion-c5-* modules.
# Passwords / JWT secret are intentionally ABSENT here — they arrive as env vars
# from secrets.appSecretName and env vars override the config file (manual §6.1).
# discover_host / validator_host default to the in-chart Services when not set;
# discover_port / validator_port default to 80 (the Service port — NOT the manual's
# module default 8080, because in-cluster traffic goes through the Services).
config:
  country_code: "SK"
  peppol_identifier: "0242:SEATID"
  peppol_certificate: "/etc/ion-c5/peppol/certificate.pem"
  peppol_private_key: "/etc/ion-c5/peppol/private.key"
  log_level: "INFO"
  discover_network: "peppol-test"
  main_db_type: "oracle"
  main_db_user: "c5main"
  main_db_host: "db.example.local"
  main_db_name: "?service_name=C5MAIN"
  receiver_db_type: "oracle"
  receiver_db_user: "c5recv"
  receiver_db_host: "db.example.local"
  receiver_db_name: "?service_name=C5RECV"
  tdd_db_type: "oracle"
  tdd_db_user: "c5tdd"
  tdd_db_host: "db.example.local"
  tdd_db_name: "?service_name=C5TDD"
  # IPs of proxies/LBs in front of the receiver (comma-separated) so that
  # X-Forwarded-For is trusted and the original sender IP is stored correctly.
  receiver_proxy_ip_addresses: ""
  processor_batch_size: 10
  processor_idle_wait_seconds: 3
  processor_workers: 1
  receiver_workers: 1
  sender_batch_size: 10
  sender_idle_wait_seconds: 3
  sender_workers: 1
  admin_workers: 1
  admin_disable_secure_cookies: "False"

# Container hardening.
# - readOnlyRootFilesystem: TRUE — supplier attested (email 2026-07-28) that b2
#   writes nothing to disk (the CRL disk cache is auto-disabled on a read-only
#   filesystem; CRLs are then held in memory and re-fetched after restarts).
#   /tmp remains an emptyDir in every pod for the runtimes.
# - runAsUser: as of 1.0.0b3+ the images declare no USER at all (root by default;
#   b2 declared named user "c5", uid 1000). On OpenShift leave null (restricted-v2
#   injects a namespace-range UID regardless of image default). On platforms that
#   enforce runAsNonRoot without SCC (vanilla k8s), set 1000 explicitly — /var/ion
#   is readable/executable by uid 1000 via "other" permissions either way.
securityContext:
  readOnlyRootFilesystem: true
  runAsUser: null

terminationGracePeriodSeconds: 60

# Optional baseline NetworkPolicies (default-deny ingress + router/same-namespace allows).
networkPolicy:
  enabled: false

# Startup ordering: admin module first.
# Kubernetes starts all Deployments in parallel; when waitForAdmin is true every
# module EXCEPT admin gets an init container that blocks until the admin Service
# answers GET /health/ready. The wait image (busybox) must be mirrored into
# global.imageRegistry. Per-module opt-out: components.<name>.waitForAdmin: false.
# CAUTION: if admin's /health/ready turns out to depend on discover/docval
# (readiness deps unconfirmed by supplier), gating those two on admin would
# deadlock startup — in that case set waitForAdmin: false on discover and docval.
startupOrder:
  waitForAdmin: true
  image:
    repository: busybox
    tag: "1.36"
    # digest: "sha256:..."   # takes precedence over tag; pin in PREPROD/PROD
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

# ---------------------------------------------------------------------------
# Per-module settings. The keys listenPortEnv / configFileEnv / useAppSecret /
# peppolCert encode module wiring from the Administrator's Manual — do not
# change them per environment.
# Probes (manual ch. 8, delivery 1.0.0b2): every runtime module serves
#   GET /health/startup   (503 while starting, then 200)
#   GET /health/ready     (dependency checks: DBs, docval, discover)
#   GET /health/liveness  (always 200 while running)
#   GET /version          ({"name":..., "version":...})
# on its listen port. Paths are overridable per component (probes.startupPath /
# readinessPath / livenessPath); set probes.type=tcp as a fallback.
# ---------------------------------------------------------------------------
components:
  # Every component image also accepts an optional `digest` (e.g.
  # digest: "sha256:abc..."), which takes precedence over `tag`.
  # Use digest pinning in PREPROD/PROD (COTS supply-chain control, fit-gap §4a).
  receiver:
    enabled: true
    image:
      repository: ion-c5-receiver
      tag: 1.0.0b5
    replicas: 2
    containerPort: 8080
    listenPortEnv: ION_C5_RECEIVER_LISTEN_PORT
    configFileEnv: ION_C5_RECEIVER_CONFIG_FILE
    useAppSecret: true
    peppolCert: true
    env: {}
    service:
      enabled: true
    probes:
      enabled: true
      type: http
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    route:
      enabled: true
      # Public AS4 hostname (SMP publishes https://<host>/as4) — set per environment.
      host: ""
      tlsTermination: edge
      annotations: {}
      # Additional alias hostnames sharing the same backend Service, each its own
      # Route object (name: "<fullname>-receiver-<name>"). tls: false emits no tls
      # block at all (plain HTTP) — set true + tlsTermination for edge termination.
      extraHosts: []
        # - name: alias
        #   host: alias.example.com
        #   tls: false
        #   tlsTermination: edge
        #   annotations: {}
    hpa:
      enabled: false
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 75
    pdb:
      enabled: true
      minAvailable: 1

  processor:
    enabled: true
    image:
      repository: ion-c5-processor
      tag: 1.0.0b5
    replicas: 1
    # Health-check-only listener (manual §6.8: processor_listen_port,
    # "only used for health checks") — no Service needed, probes go to the pod.
    containerPort: 8080
    listenPortEnv: ION_C5_PROCESSOR_LISTEN_PORT
    configFileEnv: ION_C5_PROCESSOR_CONFIG_FILE
    useAppSecret: true
    peppolCert: false
    env: {}
    service:
      enabled: false
    probes:
      enabled: true
      type: http
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi
    hpa:
      enabled: false
    pdb:
      enabled: false

  sender:
    enabled: true
    image:
      repository: ion-c5-sender
      tag: 1.0.0b5
    replicas: 1
    # Health-check-only listener (manual §6.8) — no Service needed.
    containerPort: 8080
    listenPortEnv: ION_C5_SENDER_LISTEN_PORT
    configFileEnv: ION_C5_SENDER_CONFIG_FILE
    useAppSecret: true
    peppolCert: true
    env: {}
    service:
      enabled: false
    probes:
      enabled: true
      type: http
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 512Mi
    hpa:
      enabled: false
    pdb:
      enabled: false

  admin:
    enabled: true
    image:
      repository: ion-c5-admin
      tag: 1.0.0b5
    replicas: 1
    containerPort: 8080
    listenPortEnv: ION_C5_ADMIN_LISTEN_PORT
    configFileEnv: ION_C5_ADMIN_CONFIG_FILE
    useAppSecret: true
    peppolCert: false
    env: {}
    service:
      enabled: true
    probes:
      enabled: true
      type: http
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    route:
      enabled: true
      # Internal admin hostname — set per environment. Access MUST be IP-restricted:
      host: ""
      tlsTermination: edge
      annotations: {}
      #   haproxy.router.openshift.io/ip_whitelist: "10.0.0.0/8 192.168.1.0/24"
      extraHosts: []
    hpa:
      enabled: false
    pdb:
      enabled: false

  discover:
    enabled: true
    image:
      repository: ion-discover
      tag: 1.0.2
    replicas: 1
    containerPort: 8080
    listenPortEnv: ION_DISCOVER_LISTEN_PORT
    configFileEnv: null
    useAppSecret: false
    peppolCert: false
    env: {}
    service:
      enabled: true
    # /health/* confirmed by supplier for all modules (email 2026-07-28;
    # in-image config: enable_health_api=true). Quick TEST verification only.
    # Fallback if needed:
    #   probes: { type: http, readinessPath: /v2, livenessPath: /v2, startupPath: /v2 }
    probes:
      enabled: true
      type: http
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    hpa:
      enabled: false
    pdb:
      enabled: false

  docval:
    enabled: true
    image:
      repository: ion-docval
      # docval versions independently of the ion-c5-1.0.0bN umbrella. Base default here
      # is 1.4.0-1; INT is still pinned to the older 1.3.3-1 via values-int.yaml (not yet
      # upgraded) — per-environment overrides can drift from this default in either
      # direction, not just lag behind it.
      tag: 1.4.0-1
    replicas: 1
    containerPort: 8080
    listenPortEnv: ION_DOCVAL_LISTEN_PORT
    configFileEnv: null
    useAppSecret: false
    peppolCert: false
    # Java (OpenJDK 21). No JVM sizing guidance from the supplier yet — the JRE
    # defaults to 25% of the container memory limit for heap; raise via e.g.:
    #   env: { JDK_JAVA_OPTIONS: "-XX:MaxRAMPercentage=60" }
    # after confirming with the supplier (HELM-CHART-GAP-ANALYSIS.md).
    env: {}
    service:
      enabled: true
    # /health/* confirmed by supplier (email 2026-07-28; in-image config:
    # EnableHealthEndpoints=true). Supplier: docval is the slowest starter
    # (~10 s, XSLT/XSD loading) — well within the 150 s startup budget.
    # Fallback if needed: type: tcp.
    probes:
      enabled: true
      type: http
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
    hpa:
      enabled: false
    pdb:
      enabled: false

  # ion-c5-setup: the DB init/migration/create-admin-user CLI, NOT a long-running server
  # (no listen port, no health endpoints). Deployed as a scale-to-zero Deployment so it
  # exists as a chart-managed object but consumes no resources until needed:
  #   oc scale deployment/<release>-ion-c5-setup --replicas=1
  #   oc exec -it deploy/<release>-ion-c5-setup -- /var/ion/ion-c5-setup/ion-c5-setup <args>
  #   oc scale deployment/<release>-ion-c5-setup --replicas=0
  # The container's entrypoint expects a subcommand (initialize-databases / migrate <db>
  # <version> / create-admin-user) and exits otherwise, so `command` overrides it to idle.
  setup:
    enabled: true
    image:
      repository: ion-c5-setup
      tag: 1.0.0b5
    replicas: 0
    command:
      - /bin/sh
      - -c
      - sleep infinity
    containerPort: null
    listenPortEnv: null
    # Confirmed by the 1.0.0b4 manual §6 ("...using the environment variables
    # ION_C5_SETUP_CONFIG_FILE, ION_C5_RECEIVER_CONFIG_FILE, etc.").
    configFileEnv: ION_C5_SETUP_CONFIG_FILE
    useAppSecret: true
    peppolCert: false
    waitForAdmin: false
    env: {}
    service:
      enabled: false
    probes:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
    hpa:
      enabled: false
    pdb:
      enabled: false
