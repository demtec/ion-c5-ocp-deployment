{{- if or .Values.setup.enabled .Values.setup.migrateOnUpgrade }}
{{- $initHooks := ternary "pre-install,pre-upgrade" "pre-install" .Values.setup.runOnUpgrade }}
{{- $cmHooks := ternary "pre-install,pre-upgrade" $initHooks .Values.setup.migrateOnUpgrade }}
# Hook-scoped copy of the config file: pre-install/pre-upgrade hooks run before
# regular manifests exist, so the Jobs cannot use the release ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ion-c5.fullname" . }}-setup-config
  labels:
    {{- include "ion-c5.labels" . | nindent 4 }}
    app.kubernetes.io/component: setup
  annotations:
    helm.sh/hook: {{ $cmHooks }}
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  config.ini: |
    {{- include "ion-c5.configIni" . | nindent 4 }}
{{- end }}
{{- if .Values.setup.enabled }}
{{- $initHooks := ternary "pre-install,pre-upgrade" "pre-install" .Values.setup.runOnUpgrade }}
---
# initialize-databases is idempotent (manual §5.1: checks schema-version tables,
# no-ops when present). It does NOT migrate existing schemas — see the migrate
# Job below for upgrades.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ion-c5.fullname" . }}-setup
  labels:
    {{- include "ion-c5.labels" . | nindent 4 }}
    app.kubernetes.io/component: setup
  annotations:
    helm.sh/hook: {{ $initHooks }}
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.setup.backoffLimit }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ion-c5.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: setup
    spec:
      restartPolicy: Never
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        {{- if .Values.securityContext.runAsUser }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: setup
          {{- if .Values.setup.image.digest }}
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.setup.image.repository }}@{{ .Values.setup.image.digest }}"
          {{- else }}
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.setup.image.repository }}:{{ .Values.setup.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["initialize-databases"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: ION_C5_SETUP_CONFIG_FILE
              value: /etc/ion-c5/config.ini
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.appSecretName }}
          resources:
            {{- toYaml .Values.setup.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/ion-c5/config.ini
              subPath: config.ini
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: {{ include "ion-c5.fullname" . }}-setup-config
{{- end }}
{{- if .Values.setup.migrateOnUpgrade }}
---
# Schema migration on upgrades: `ion-c5-setup migrate <db> latest` per database
# (manual §5.1.2 — idempotent, no-ops when already at target version).
# PRECONDITIONS before enabling: DB backups in place; <db> argument names
# confirmed with the supplier (HELM-CHART-GAP-ANALYSIS.md item G-7).
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ion-c5.fullname" . }}-migrate
  labels:
    {{- include "ion-c5.labels" . | nindent 4 }}
    app.kubernetes.io/component: setup
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ion-c5.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: setup
    spec:
      restartPolicy: Never
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        {{- if .Values.securityContext.runAsUser }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          {{- if .Values.setup.image.digest }}
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.setup.image.repository }}@{{ .Values.setup.image.digest }}"
          {{- else }}
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.setup.image.repository }}:{{ .Values.setup.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          # The image ENTRYPOINT takes one command per invocation; chain the
          # per-DB migrations in a shell (bash is present, Debian base).
          command: ["/bin/bash", "-ec"]
          args:
            - |
              {{- range .Values.setup.migrateDatabases }}
              /var/ion/ion-c5-setup/ion-c5-setup migrate {{ . }} latest
              {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: ION_C5_SETUP_CONFIG_FILE
              value: /etc/ion-c5/config.ini
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.appSecretName }}
          resources:
            {{- toYaml .Values.setup.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/ion-c5/config.ini
              subPath: config.ini
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: {{ include "ion-c5.fullname" . }}-setup-config
{{- end }}
